version: 2

seeds:
  - name: chains
    description: The four hamburger chains and their Wikidata ids (found in notebook 01).
    config:
      column_types:
        chain: varchar
        chain_name: varchar
        brand_wikidata: varchar
        origin: varchar
    columns:
      - name: chain
        data_tests:
          - unique
          - not_null
      - name: brand_wikidata
        data_tests:
          - unique
          - not_null
      - name: origin
        data_tests:
          - accepted_values:
              arguments:
                values: [swedish, international]

  - name: osm_manual_exclusions
    description: >
      OSM places that are not a real, open restaurant of the chain:
      wrong brand (e.g. Max Falafel), permanently closed, or a duplicate point.
      Verified manually against news sources and Google Maps (21–22 Nov 2026).
      Temporarily closed restaurants are NOT excluded.
    config:
      column_types:
        osm_type: varchar
        osm_id: bigint
        reason: varchar
    columns:
      - name: osm_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [node, way, relation]
      - name: osm_id
        data_tests:
          - not_null
      - name: reason
        data_tests:
          - not_null

  - name: osm_manual_additions
    description: >
      Open restaurants that are missing in OpenStreetMap, added by hand.
      Every row has coordinates checked on Google Maps and a source.
    config:
      column_types:
        addition_id: integer
        chain: varchar
        name: varchar
        lat: double
        lon: double
        opened: varchar
        source: varchar
    columns:
      - name: addition_id
        data_tests:
          - unique
          - not_null
      - name: chain
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chains')
                field: chain
      - name: lat
        data_tests:
          - not_null
      - name: lon
        data_tests:
          - not_null
      - name: source
        data_tests:
          - not_null
